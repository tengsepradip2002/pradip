<!-- Include Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Optional Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<div class="container mt-5">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between">
      <h3 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Add New Employee</h3>
      <a href="{% url 'index' %}" class="btn btn-light btn-sm"><i class="bi bi-arrow-left-circle me-1"></i>Home</a>
    </div>

    <div class="card-body bg-light">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>{{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" class="p-3">
        {% csrf_token %}
        
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" class="form-control" id="first_name" name="first_name" required placeholder="Enter first name">
          </div>

          <div class="col-md-6 mb-3">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="last_name" name="last_name" required placeholder="Enter last name">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="dept" class="form-label">Department</label>
            <select class="form-select" id="dept" name="dept">
              <option disabled selected>Select department</option>
              {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label for="role" class="form-label">Role</label>
            <select class="form-select" id="role" name="role">
              <option disabled selected>Select role</option>
              {% for role in roles %}
                <option value="{{ role.id }}">{{ role.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
          <label class="form-label">Location:</label>
          <input type="text" class="form-control" name="location" required>
          </div>

        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="salary" class="form-label">Salary</label>
            <input type="number" class="form-control" id="salary" name="salary" required placeholder="Enter salary">
          </div>

          <div class="col-md-6 mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone"
            required pattern="\d{10}" maxlength="10" placeholder="Enter 10-digit phone number"
            title="Phone number must be exactly 10 digits">
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success me-2"><i class="bi bi-plus-circle me-1"></i>Add Employee</button>
          <a href="{% url 'index' %}" class="btn btn-secondary"><i class="bi bi-arrow-return-left me-1"></i>Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
