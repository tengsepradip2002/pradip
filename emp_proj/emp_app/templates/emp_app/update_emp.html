{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Employee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(to right, #e0ecff, #fdfbfb);
      min-height: 100vh;
      padding-top: 50px;
    }

    .container {
      max-width: 700px;
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .form-label {
      font-weight: 600;
      color: #34495e;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
    }

    .btn-success {
      background: linear-gradient(to right, #28a745, #218838);
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      transition: all 0.3s ease;
    }

    .btn-success:hover {
      background: linear-gradient(to right, #218838, #1e7e34);
      transform: scale(1.03);
    }

    .btn-secondary {
      border-radius: 10px;
      margin-left: 10px;
    }

    .alert {
      font-weight: 500;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <h2>✏️ Update Employee</h2>

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">First Name:</label>
        <input type="text" class="form-control" name="first_name" value="{{ emp.first_name }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Last Name:</label>
        <input type="text" class="form-control" name="last_name" value="{{ emp.last_name }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Department:</label>
        <select class="form-select" name="dept">
          {% for dept in departments %}
            <option value="{{ dept.id }}" {% if emp.dept.id == dept.id %}selected{% endif %}>
              {{ dept.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Role:</label>
        <select class="form-select" name="role">
          {% for role in roles %}
            <option value="{{ role.id }}" {% if emp.role.id == role.id %}selected{% endif %}>
              {{ role.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Salary:</label>
        <input type="number" class="form-control" name="salary" value="{{ emp.salary }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone:</label>
        <input type="text" class="form-control" name="phone"
        value="{{ emp.phone }}" required
        maxlength="10" pattern="\d{10}"
        title="Phone number must be exactly 10 digits">

      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success">💾 Save Changes</button>
        <a href="{% url 'update_list' %}" class="btn btn-secondary">🔙 Cancel</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
